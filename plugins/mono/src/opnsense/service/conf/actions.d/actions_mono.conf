[status]
command:/usr/local/opnsense/scripts/mono/status.py
type:script_output
message:Read Mono Gateway release and offload status

[start]
command:/usr/local/etc/rc.d/cmm onestart
type:script
message:Starting cmm

[stop]
command:/usr/local/etc/rc.d/cmm onestop
type:script
message:Stopping cmm

[restart]
command:/usr/local/etc/rc.d/cmm onerestart
type:script
message:Restarting cmm
