[status]
command:/usr/local/opnsense/scripts/mono/status.py
type:script_output
message:Read Mono Gateway release and offload status

[connections]
command:/usr/local/opnsense/scripts/mono/connections.sh
type:script_output
message:Read hardware and CPU connection counts

[start]
command:/usr/local/etc/rc.d/cmm onestart
type:script
message:Starting cmm

[stop]
command:/usr/local/etc/rc.d/cmm onestop
type:script
message:Stopping cmm

[restart]
command:/usr/local/etc/rc.d/cmm onerestart
type:script
message:Restarting cmm

[sfp]
command:/usr/local/opnsense/scripts/mono/sfp.py
type:script_output

[sfplog]
command:/usr/local/opnsense/scripts/mono/sfp.py log
parameters:%s
type:script_output

[cpu.stream]
command:/usr/local/opnsense/scripts/mono/cpu.py
parameters:--interval %s
type:stream_output
message:Stream CPU use per core

[fand.reload]
command:/usr/local/etc/rc.d/fand reload || /usr/local/etc/rc.d/fand start
type:script
message:Applying fan control settings

[fand.sensors]
command:/sbin/sysctl hw.temperature
type:script_output
message:Read temperature sensors for fan control
