# Written from System: Settings: Fan control. Changes made here are overwritten.
# Built-in curves
curve silent sensors core-cluster points 60:20,70:35,80:70,85:100
curve standard sensors core-cluster points 40:20,80:100
curve full sensors core-cluster points 0:100
{% set fans = {} %}
{% for fan in ['fan0', 'fan1'] %}
{%   do fans.update({fan: OPNsense.Mono.fan.fans[fan] if helpers.exists('OPNsense.Mono.fan.fans.' ~ fan) else 'standard'}) %}
{% endfor %}
{% set ids = {'off': 'off', 'silent': 'silent', 'standard': 'standard', 'full': 'full'} %}
{% if helpers.exists('OPNsense.Mono.fan.curves.curve') %}
# Your curves in use
{%   for c in helpers.toList('OPNsense.Mono.fan.curves.curve') if c.points and c.sensors and c['@uuid'] in fans.values() %}
curve {{ c.name|replace(' ', '_') }} sensors {{ c.sensors }} points {{ c.points }}
{%     do ids.update({c['@uuid']: c.name|replace(' ', '_')}) %}
{%   endfor %}
{% endif %}
# Fans
{% for fan in ['fan0', 'fan1'] %}
fan {{ loop.index0 }} {{ ids.get(fans[fan], 'standard') }}
{% endfor %}
